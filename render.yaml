services:
  - type: web
    name: cipher-room
    runtime: node
    region: singapore
    plan: free
    buildCommand: NODE_ENV=development npm install && npm run build && npm run build:server
    startCommand: NODE_ENV=production npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
